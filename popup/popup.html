<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="popup.css"></head>
<body>
  <h1>EH Link Corrector</h1>
  <label class="row"><input type="checkbox" id="enabled"> Enabled</label>
  <label>Your eHub tenant
    <select id="tenant"></select>
  </label>
  <div class="custom">
    <input id="custom" placeholder="Add tenant (e.g. acme)">
    <button id="add">Add</button>
  </div>

    (<code>&lt;tenant&gt;.eh.go.servicetitan.com</code>). Unofficial; not affiliated with ServiceTitan.</p>
  <p id="status"></p>
  <script type="module" src="popup.js"></script>
</body></html>
